server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The main JS bundle is ~3.6MB and was being sent completely
    # uncompressed - no Content-Encoding at all despite clients requesting
    # gzip - making it the single biggest contributor to slow first loads,
    # especially on mobile networks. Text/JS compresses to roughly a
    # quarter of its size, so this alone should cut initial load time
    # dramatically without touching a single line of app code.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Content-hashed JS/CSS bundles are safe to cache forever - a new build
    # always ships under a new filename.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every route's HTML shell (login.html, mark-attendance.html, etc, via
    # try_files below) references a specific bundle hash, and none of them
    # have a hashed filename themselves - only the literal /index.html was
    # previously marked no-cache, so every other route's HTML got cached
    # indefinitely by browsers/installed PWAs, silently freezing users on
    # whatever build was first cached even after new deploys. Apply
    # no-cache to the whole catch-all so every route always revalidates.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ $uri.html /index.html;
    }
}
